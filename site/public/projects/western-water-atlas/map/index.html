<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee5d5"><title>Western Water Atlas</title><link rel="stylesheet" href="style.css"></head><body>
<main aria-label="Western Water Atlas map"><canvas id="map" aria-label="Map of western rivers, reservoirs and aqueducts. Use Explore for a keyboard-accessible place list."></canvas>
<nav id="controls" aria-label="Map controls"><button id="layers" aria-expanded="false">Layers</button><button id="explore" aria-expanded="false">Explore <span>⌕</span></button><button id="uses" aria-expanded="false">Uses</button><button id="tour-btn" title="A ten-stop guided story of western water">Tour</button><button id="scope-toggle" aria-pressed="false" title="Back to the whole map">Focus</button></nav>
<aside id="trace-bar" hidden><button id="trace-exit">Exit trace</button><button id="trace-fit">Fit system</button><p id="trace-notes"></p></aside><section id="panel" hidden aria-label="Map options"></section><section id="card" hidden aria-label="Selected place"></section>
<div id="loading" role="status"><div class="loading-mark">≈</div><h1>Preparing the landscape</h1><p id="stage">Reading the latest observations</p><button id="retry" hidden>Try again</button></div>
<aside id="legend" aria-label="Map key"><div><i class="river"></i> Rivers <i class="canal"></i> Aqueducts <i class="dot"></i> Reservoirs</div><div id="snow-legend" hidden><i class="snow-symbol"></i> Snowpack · inches SWE · station-dated</div><div class="scale"><span id="scale"></span></div></aside>
</main><script type="module" src="app.js"></script><aside id="tour" hidden aria-live="polite"><div class="tour-head"><span id="tour-count"></span><button id="tour-close" aria-label="End tour">×</button></div><h2 id="tour-title"></h2><p id="tour-text"></p><div class="tour-nav"><button id="tour-prev">← Back</button><button id="tour-next">Next →</button></div></aside><button id="recenter" hidden aria-label="Back to the whole map">⟲ Re-center</button><div id="tap-hint" role="status" hidden><span>Tap any river, lake, reservoir or city to see where its water comes from.</span><button id="tap-hint-close" aria-label="Dismiss hint">×</button></div></body></html>
