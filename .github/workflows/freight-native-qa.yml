name: Freight native browser QA
on:
  workflow_dispatch:
  push:
    branches: [fix/freight-final-mobile]
    paths: ['mobile-polish-tests/**', '.github/workflows/freight-native-qa.yml', 'site/public/projects/freight-atlas/**', 'site/src/content/projects/freight-atlas.mdx']
  pull_request:
    branches: [main]
    paths: ['mobile-polish-tests/**', '.github/workflows/freight-native-qa.yml', 'site/public/projects/freight-atlas/**', 'site/src/content/projects/freight-atlas.mdx']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Isolated hosted Python transport
        run: |
          python -m venv "$RUNNER_TEMP/freight-qa-venv"
          "$RUNNER_TEMP/freight-qa-venv/bin/python" -m pip install websockets==15.0.1
          google-chrome --version
      - name: Focused production seams
        run: node --max-old-space-size=128 --test --test-concurrency=1 mobile-polish-tests/*.test.cjs
      - name: Native public-root Chromium acceptance
        run: '"$RUNNER_TEMP/freight-qa-venv/bin/python" mobile-polish-tests/native-qa.py --root site/public --out qa-artifacts'
      - name: Retain bounded UI evidence (never browser profile or environment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freight-native-${{ github.sha }}
          path: |
            qa-artifacts/receipt-*.json
            qa-artifacts/receipt-*.png
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
