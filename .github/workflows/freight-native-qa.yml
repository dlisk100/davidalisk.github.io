name: Freight native browser QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Media-only accepted runtime identity and offline contracts
        run: |
          git diff --exit-code 5d772b48024a62f2d08aa4fed8b0b0505de5a125 HEAD -- site/public/projects/freight-atlas site/src/content/projects/freight-atlas.mdx
          python -m unittest discover -s mobile-polish-tests -p 'test_*.py' -v
          python -m venv "$RUNNER_TEMP/freight-qa-venv"
          "$RUNNER_TEMP/freight-qa-venv/bin/python" -m pip install websockets==15.0.1
          google-chrome --version
      - uses: pnpm/action-setup@v4
        with:
          version: '10.23.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build unchanged accepted Astro runtime (no full QA rerun)
        working-directory: site
        run: pnpm install --frozen-lockfile && pnpm build
      - name: ONE native media recovery capture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          "$RUNNER_TEMP/freight-qa-venv/bin/python" mobile-polish-tests/share-media.py
      - name: Preserve every actual raw JPEG on success OR failure
        if: always()
        run: python mobile-polish-tests/raw_chunks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freight-motion-${{ github.sha }}
          path: |
            share-artifacts/*.mp4
            share-artifacts/*.png
            share-artifacts/*.jpg
            share-artifacts/*.json
            share-artifacts/*.concat
            raw-chunks/raw-hashes.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freight-raw-00-${{ github.sha }}
          path: raw-chunks/part-00.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freight-raw-01-${{ github.sha }}
          path: raw-chunks/part-01.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freight-raw-02-${{ github.sha }}
          path: raw-chunks/part-02.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freight-raw-03-${{ github.sha }}
          path: raw-chunks/part-03.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freight-raw-04-${{ github.sha }}
          path: raw-chunks/part-04.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
